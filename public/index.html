<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; manifest-src 'self'">
<meta name="theme-color" content="#0b1120">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ma3madan Remote</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-96.png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<style>
  :root { --bg: #0b1120; --panel: #141c2e; --panel-2: #1b2539; --line: #26324a; --text: #eef2f8; --muted: #8e9ab0; --accent: #3b82f6; --gold: #f2b84b; --live: #e5484d; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, "Segoe UI", Tahoma, sans-serif; }
  body { padding: max(14px, env(safe-area-inset-top)) 14px max(18px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; min-height: 100vh; user-select: none; }
  header { display: flex; align-items: center; gap: 10px; }
  header b { flex: 1; font-size: 15px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: #30a46c; box-shadow: 0 0 0 4px rgba(48,164,108,.2); }
  .status { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--panel-2); color: var(--muted); }
  .status.live { background: var(--live); color: #fff; }
  .status.standby { background: #2b3446; color: #fff; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .title { font-size: 19px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .next { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 1.2em; }
  .logo { width: 30px; height: 30px; border-radius: 8px; }
  .seekwrap { position: relative; height: 30px; display: flex; align-items: center; direction: ltr; }
  #seek { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; margin: 0; border-radius: 99px; background: linear-gradient(to right, var(--accent) var(--p, 0%), var(--line) var(--p, 0%)); }
  #seek::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.5); position: relative; z-index: 2; }
  .ticks { position: absolute; left: 11px; right: 11px; top: 50%; height: 0; pointer-events: none; }
  .ticks i { position: absolute; top: -7px; width: 3px; height: 14px; margin-left: -1.5px; border-radius: 2px; background: var(--gold); }
  .marks button { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
  .marks button b { font: 600 12px ui-monospace, Consolas, monospace; color: var(--gold); direction: ltr; }
  .marks button.on { border-color: var(--gold); background: #2b2412; }
  .times { display: flex; justify-content: space-between; font: 600 12px ui-monospace, Consolas, monospace; color: var(--muted); direction: ltr; }
  .row { display: flex; align-items: center; justify-content: center; gap: 8px; direction: ltr; }
  .row button { min-width: 0; width: 54px; padding: 0; flex: none; }
  button { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: 16px; min-height: 56px; min-width: 56px; padding: 0 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  button:active { transform: scale(.96); background: var(--line); }
  button svg { width: 26px; height: 26px; }
  button.play { width: 78px !important; height: 78px; border-radius: 50%; background: var(--accent); border-color: var(--accent); }
  button.play svg { width: 38px; height: 38px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .grid button { flex-direction: column; gap: 4px; font-size: 12.5px; min-height: 72px; color: var(--muted); }
  .grid button svg { color: var(--text); }
  .grid button.on { background: var(--live); border-color: var(--live); color: #fff; }
  .grid button.on.freeze { background: #38bdf8; border-color: #38bdf8; color: #04263b; }
  .grid button.on svg { color: inherit; }
  .card.vol { flex-direction: row; align-items: center; gap: 12px; direction: ltr; padding: 10px 14px; }
  .vol button { min-height: 48px; min-width: 48px; border-radius: 14px; }
  .vol input { flex: 1; accent-color: var(--accent); height: 32px; }
  .vol span { min-width: 46px; text-align: end; font: 600 13px ui-monospace, Consolas, monospace; color: var(--muted); }
  h3 { margin: 4px 2px 0; font-size: 14px; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  li { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line); }
  li:active { background: var(--panel-2); }
  li.playing { border-color: var(--accent); background: #16274a; }
  li.missing { opacity: .45; }
  li .th { width: 72px; height: 40px; border-radius: 8px; background: #000 center/cover no-repeat; flex: none; display: grid; place-items: center; color: var(--muted); }
  li .th svg { width: 20px; height: 20px; }
  li .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14.5px; }
  li .d { font: 12px ui-monospace, Consolas, monospace; color: var(--muted); direction: ltr; }
  .lyrics { display: flex; flex-direction: column; gap: 6px; }
  .lyrics button { justify-content: flex-start; text-align: start; white-space: pre-line; font-size: 14px; min-height: 48px; padding: 10px 14px; line-height: 1.45; }
  .lyrics button.on { border-color: var(--gold); background: #2b2412; }
  .off { color: var(--muted); text-align: center; padding: 40px 10px; }
  [hidden] { display: none !important; }

  /* ---------- the app around the remote ---------- */
  body { padding-bottom: calc(86px + env(safe-area-inset-bottom)); }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 4px 0 8px; }
  header .who { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.2; }
  header .who b { font-size: 15px; }
  header .who small { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom)); background: rgba(11, 17, 32, .96); border-top: 1px solid var(--line); backdrop-filter: blur(8px); }
  .tabs button { min-height: 56px; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); background: transparent; border: 0; }
  .tabs button svg { width: 24px; height: 24px; }
  .tabs button.on { color: var(--text); background: var(--panel-2); }
  .screen { display: flex; flex-direction: column; gap: 14px; }
  .center { text-align: center; align-items: center; padding: 24px 6px; }
  .center img { width: 84px; height: 84px; border-radius: 20px; }
  .center h2 { margin: 6px 0 0; font-size: 20px; }
  .center p { margin: 0; color: var(--muted); line-height: 1.6; max-width: 340px; }
  ol.steps { margin: 0; padding-inline-start: 22px; color: var(--text); line-height: 1.9; text-align: start; }
  .primary { background: var(--accent); border-color: var(--accent); }
  .spinner { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .laptops { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
  .laptops button { min-height: 40px; border-radius: 999px; font-size: 13px; padding: 0 12px 0 10px; flex: none; }
  .laptops button.on { border-color: var(--accent); background: #16274a; }
  .laptops button svg { width: 18px; height: 18px; }
  .soon { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: #2b2412; color: var(--gold); font-weight: 600; }
  .hint { font-size: 12.5px; color: var(--muted); text-align: center; line-height: 1.6; }
  .link-btn { background: none; border: 0; min-height: 0; color: var(--muted); font-size: 13px; text-decoration: underline; padding: 6px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z" fill="currentColor"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z" fill="currentColor"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M5 5v14l10-7zM16 5h3v14h-3z" fill="currentColor"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M19 5v14L9 12zM5 5h3v14H5z" fill="currentColor"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z" fill="currentColor"/></symbol>
  <symbol id="i-fwd" viewBox="0 0 24 24"><path d="M12 5V2l5 4-5 4V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z" fill="currentColor"/></symbol>
  <symbol id="i-black" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2" fill="currentColor"/><path d="M9 20.5h6M12 17v3.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></symbol>
  <symbol id="i-freeze" viewBox="0 0 24 24"><path d="M12 2.5v19M3.8 7.25l16.4 9.5M3.8 16.75l16.4-9.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2" fill="currentColor"/></symbol>
  <symbol id="i-vol" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V6l11-2v12" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="6.5" cy="18" r="2.5" fill="currentColor"/><circle cx="17.5" cy="16" r="2.5" fill="currentColor"/></symbol>

  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></symbol>
  <symbol id="i-laptop" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="11" rx="1.5" stroke="currentColor" stroke-width="2" fill="none"/><path d="M2 19h20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-slides" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="1.5" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 16v4M8 20h8M7 8h6M7 11h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="i-retry" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7M4 4v4h4" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</svg>

<header>
  <img class="logo" src="/icons/icon-96.png" alt="">
  <span class="who"><b id="appName">Ma3madan Remote</b><small id="whoSub"></small></span>
  <span id="dot" class="dot"></span><span id="status" class="status" hidden></span>
</header>

<!-- Ma3madan Play -->
<main id="tab-play" class="screen">
  <div id="laptops" class="laptops" hidden></div>

  <section id="pairScreen" class="screen center card" hidden>
    <img src="/icons/icon-192.png" alt="">
    <h2 data-s="pairTitle"></h2>
    <ol class="steps">
      <li data-s="pair1"></li>
      <li data-s="pair2"></li>
      <li data-s="pair3"></li>
    </ol>
    <p class="hint" data-s="pairHint"></p>
  </section>

  <section id="connectScreen" class="screen center card" hidden>
    <div id="spinner" class="spinner"></div>
    <h2 id="connTitle"></h2>
    <p id="connText"></p>
    <button id="retryBtn" class="primary" hidden><svg><use href="#i-retry"/></svg><span data-s="retry"></span></button>
    <button id="forgetBtn" class="link-btn" hidden data-s="forget"></button>
  </section>

  <div id="remoteUi" class="screen" hidden>
    <section class="card">
      <div id="title" class="title" dir="auto"></div>
      <div id="next" class="next" dir="auto"></div>
      <div class="seekwrap"><div id="ticks" class="ticks"></div><input id="seek" type="range" min="0" max="1000" step="1" value="0" aria-label="Seek"></div>
      <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
      <div class="row">
        <button data-a="prev" aria-label="Previous"><svg><use href="#i-prev"/></svg></button>
        <button data-a="back" aria-label="Back 10 s"><svg><use href="#i-back"/></svg></button>
        <button data-a="toggle" class="play" id="playBtn" aria-label="Play"><svg><use href="#i-play"/></svg></button>
        <button data-a="fwd" aria-label="Forward 10 s"><svg><use href="#i-fwd"/></svg></button>
        <button data-a="next" aria-label="Next"><svg><use href="#i-next"/></svg></button>
      </div>
    </section>
    
    <div class="grid">
      <button data-a="black" id="blackBtn"><svg><use href="#i-black"/></svg><span data-s="standby"></span></button>
      <button data-a="freeze" id="freezeBtn" class="freeze"><svg><use href="#i-freeze"/></svg><span data-s="freeze"></span></button>
      <button data-a="stop"><svg><use href="#i-stop"/></svg><span data-s="stop"></span></button>
    </div>
    
    <div class="vol card">
      <button data-a="mute" id="muteBtn"><svg><use href="#i-vol"/></svg></button>
      <input id="vol" type="range" min="0" max="200" step="5">
      <span id="volPct"></span>
    </div>
    
    <section id="marksBox" hidden>
      <h3><span data-s="marks"></span><button data-a="addMark" style="min-height:32px;padding:0 12px;font-size:12px" data-s="addHere"></button></h3>
      <div id="marks" class="lyrics marks"></div>
    </section>
    
    <section id="lyricsBox" hidden>
      <h3><span data-s="lyrics"></span><button data-a="lyricsOff" style="min-height:32px;padding:0 10px;font-size:12px" data-s="hide"></button></h3>
      <div id="lyrics" class="lyrics"></div>
    </section>
    
    <h3><span id="listName"></span><span id="count"></span></h3>
    <ul id="list"></ul>
  </div>
</main>

<!-- Ma3madan PPT, the PowerPoint remote (coming later) -->
<main id="tab-slides" class="screen" hidden>
  <section class="screen center card">
    <svg style="width:64px;height:64px;color:var(--gold)"><use href="#i-slides"/></svg>
    <h2 data-s="slidesTitle"></h2>
    <span class="soon" data-s="soon"></span>
    <p data-s="slidesText"></p>
  </section>
</main>

<nav class="tabs">
  <button data-tab="play" class="on"><svg><use href="#i-play"/></svg><span>Ma3madan Play</span></button>
  <button data-tab="slides"><svg><use href="#i-slides"/></svg><span data-s="slidesTab"></span></button>
</nav>

<script src="/link.js"></script>
<script src="/app.js"></script>
</body>
</html>
