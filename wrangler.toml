# Cloudflare Pages: the phone app (public/) + functions/ (signaling, nearby computers, relays).
name = "ma3madan-remote"
pages_build_output_dir = "public"
compatibility_date = "2025-01-01"

# Signaling messages, kept ten minutes (schema.sql).
[[d1_databases]]
binding = "DB"
database_name = "ma3madan-remote"
database_id = "116d5daf-16d9-441b-b309-8e7d38955728"

# The signaling rooms: Durable Objects of the ma3madan-signal worker (worker/), used by /api/ws.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"
script_name = "ma3madan-signal"

# Secrets (set with wrangler, never committed): TURN_KEY_ID, TURN_KEY_TOKEN for /api/turn.
